[package]
name = "audio"
version = "0.1.0"
edition = "2024"
description = "Unified audio capture and transcription layer (source of truth for Tauri apps)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# Local ASR runs GGUF models on the ggml runtime via transcribe-cpp.
# Optional: only needed when the `local` feature is enabled. On machines
# without a GPU or a capable CPU (e.g. Raspberry Pi), disable `local` to skip
# building the native C++ library entirely — the Mistral cloud provider still
# works without it.
transcribe-cpp = { version = "0.4.0", default-features = false, optional = true }
rustls = { version = "0.23", features = ["ring"] }
futures-util = { version = "0.3", features = ["sink", "std"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking"] }
sha2 = "0.10"

[features]
default = ["local", "vulkan"]
# Local (offline) ASR via transcribe-cpp / ggml. Enabled by default so desktop
# builds get on-device transcription. Disable on machines that can't build the
# native C++ library (e.g. Raspberry Pi without a C++ toolchain or Vulkan SDK).
local = ["dep:transcribe-cpp"]
# Vulkan GPU acceleration for the ggml runtime. Enabled by default so local
# builds get GPU support, but requires the Vulkan SDK (glslc, vulkan-headers,
# loader) at build time. Disable it (e.g. in CI with --no-default-features)
# when the Vulkan toolchain is not available and CPU-only is acceptable.
vulkan = ["local", "transcribe-cpp/vulkan"]
# WebSocket server binary (`--features server`). Library consumers (Tauri
# apps) leave this off and don't need server-only tokio I/O features.
server = ["tokio/net", "tokio/sync"]

[[bin]]
name = "audio-server"
path = "src/bin/audio-server.rs"
required-features = ["server"]
