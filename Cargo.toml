[package]
name = "audio"
version = "0.1.0"
edition = "2024"
description = "Unified audio capture and transcription layer (source of truth for Tauri apps)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# Local ASR runs GGUF models on the ggml runtime via transcribe-cpp.
# `default-features = false` disables the Metal default so the build is portable
# (CPU-only); GPU backends can be opted in per-platform later.
transcribe-cpp = { version = "0.4.0", default-features = false }
rustls = { version = "0.23", features = ["ring"] }
futures-util = { version = "0.3", features = ["sink", "std"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking"] }
sha2 = "0.10"

[features]
# WebSocket server binary (`--features server`). Library consumers (Tauri
# apps) leave this off and don't need server-only tokio I/O features.
server = ["tokio/net", "tokio/sync"]

[[bin]]
name = "audio-server"
path = "src/bin/audio-server.rs"
required-features = ["server"]
