[package]
name = "audio"
version = "0.1.0"
edition = "2024"
description = "Unified audio capture and transcription layer (source of truth for Tauri apps)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
# Local ASR runs GGUF models on the ggml runtime via transcribe-cpp.
# Vulkan provides GPU acceleration (AMD/NVIDIA/Intel on Linux); `metal` is
# the macOS default and is disabled so the build is portable. Enabling Vulkan
# requires the Vulkan SDK (glslc, vulkan-headers) at build time.
transcribe-cpp = { version = "0.4.0", default-features = false }
rustls = { version = "0.23", features = ["ring"] }
futures-util = { version = "0.3", features = ["sink", "std"] }
directories = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking"] }
sha2 = "0.10"

[features]
default = ["vulkan"]
# Vulkan GPU acceleration for the ggml runtime. Enabled by default so local
# builds get GPU support, but requires the Vulkan SDK (glslc, vulkan-headers,
# loader) at build time. Disable it (e.g. in CI with --no-default-features)
# when the Vulkan toolchain is not available and CPU-only is acceptable.
vulkan = ["transcribe-cpp/vulkan"]
# WebSocket server binary (`--features server`). Library consumers (Tauri
# apps) leave this off and don't need server-only tokio I/O features.
server = ["tokio/net", "tokio/sync"]

[[bin]]
name = "audio-server"
path = "src/bin/audio-server.rs"
required-features = ["server"]
