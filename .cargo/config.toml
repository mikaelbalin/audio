# Build-time environment for the `audio` crate.
#
# `transcribe-cpp-sys` compiles the native ggml/transcribe.cpp C++ core with
# CMake, which needs to find the Vulkan SDK for the GPU backend. Set a single
# `CMAKE_ARGS` env var (see the project README / `.env.example`) for a
# non-standard SDK location; leave it unset for a system install (/usr).
# `transcribe-cpp-sys` forwards `CMAKE_ARGS` to CMake, and `audio/build.rs`
# derives the linker `-L` path from the same value.
